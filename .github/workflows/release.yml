name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugin
        run: |
          RUSTFLAGS="-C link-arg=--import-undefined" cargo build -p d4games --target wasm32-unknown-unknown --release
          mkdir -p plugins
          cp target/wasm32-unknown-unknown/release/d4games.wasm plugins/

      - name: Build Orchestrator Binary
        run: cargo build --bin mitosis-orchestrator --release

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Fabric Bridge Mod
        working-directory: ./fabric-bridge
        run: |
          chmod +x gradlew
          ./gradlew remapJar

      - name: Package Distribution Tarball
        run: |
          mkdir -p dist/plugins dist/skins dist/web
          cp target/release/mitosis-orchestrator dist/
          cp -r web dist/
          cp -r skins dist/
          cp plugins/*.wasm dist/plugins/ 2>/dev/null || true
          cp config.toml dist/
          cd dist
          tar -czvf ../mitosis-linux-x86_64.tar.gz *
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Mitosis Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            mitosis-linux-x86_64.tar.gz
            target/release/mitosis-orchestrator
            fabric-bridge/build/libs/mitosis-bridge-*.jar
            pterodactyl/egg-mitosis.json

  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
